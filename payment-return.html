<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12110f"><title>Payment Status | Hadhramawt City</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css"><style>.status-page{min-height:100vh;display:grid;place-items:center;padding:30px;background:radial-gradient(circle at 70% 20%,rgba(242,183,5,.18),transparent 30%),#fffdf7}.status-card{max-width:620px;width:100%;background:white;border:1px solid var(--line);border-radius:28px;padding:36px;box-shadow:var(--shadow);text-align:center}.status-icon{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#fff1bd;margin:0 auto 18px;font-size:30px}.status-card h1{font-family:'Playfair Display',serif;font-size:46px;line-height:1;margin:0}.status-card p{color:var(--muted)}.status-detail{margin:25px 0;text-align:left;border:1px solid var(--line);border-radius:16px;padding:16px}.status-row{display:flex;justify-content:space-between;gap:20px;padding:7px 0}.status-row span{color:var(--muted);font-size:12px}.status-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}</style></head><body><main class="status-page"><section class="status-card"><div class="status-icon" id="statusIcon">…</div><div class="eyebrow">Hadhramawt City pickup</div><h1 id="statusTitle">Checking payment</h1><p id="statusMessage">We are confirming your Billplz payment. This usually takes only a moment.</p><div class="status-detail" id="statusDetail" hidden></div><div class="status-actions"><a class="button button-primary" href="./">Back to menu</a><a class="button button-ghost" href="tel:+601111046311">Call restaurant</a></div></section></main><script type="module">
const params=new URLSearchParams(location.search);const billId=params.get('billplz[id]')||params.get('id');const title=document.querySelector('#statusTitle'),msg=document.querySelector('#statusMessage'),icon=document.querySelector('#statusIcon'),detail=document.querySelector('#statusDetail');
const fmt=n=>new Intl.NumberFormat('en-MY',{style:'currency',currency:'MYR'}).format(n/100);
async function check(attempt=0){if(!billId){title.textContent='Payment reference missing';msg.textContent='We could not find a Billplz payment reference. Please contact the restaurant if you have already paid.';icon.textContent='!';return;}try{const r=await fetch(`./api/order-status?bill_id=${encodeURIComponent(billId)}`);const d=await r.json();if(!r.ok)throw new Error(d.message||'Unable to verify payment');if(d.status==='paid'){icon.textContent='✓';title.textContent='Payment confirmed';msg.textContent='Thank you. Your pickup order has been received and paid.';detail.hidden=false;detail.innerHTML=`<div class="status-row"><span>Order</span><strong>${d.orderId}</strong></div><div class="status-row"><span>Total</span><strong>${fmt(d.amountCents)}</strong></div><div class="status-row"><span>Pickup</span><strong>${new Date(d.pickupAt).toLocaleString('en-MY',{dateStyle:'medium',timeStyle:'short'})}</strong></div>`;localStorage.removeItem('hadhramawt-cart');return;}if(attempt<5){setTimeout(()=>check(attempt+1),1800);return;}icon.textContent='⌛';title.textContent='Payment is processing';msg.textContent='Billplz has not confirmed the payment yet. If you completed payment, keep this page or check again shortly.';}catch(e){if(attempt<3){setTimeout(()=>check(attempt+1),1800);return;}icon.textContent='!';title.textContent='We could not verify payment';msg.textContent=e.message;}}
check();
</script></body></html>
